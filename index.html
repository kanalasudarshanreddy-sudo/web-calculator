<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" role="application" aria-label="Calculator">
    <!-- The display shows the current input / result -->
    <div class="display" id="display" aria-live="polite">0</div>

    <!-- Button grid. data-* attributes tell the JS what each button does -->
    <div class="buttons">
      <button class="btn btn-clear" data-action="clear" aria-label="Clear">AC</button>
      <button class="btn btn-action" data-action="delete" aria-label="Delete">⌫</button>
      <button class="btn btn-action" data-action="percent" aria-label="Percent">%</button>
      <button class="btn btn-operator" data-op="/" aria-label="Divide">÷</button>

      <button class="btn" data-num="7">7</button>
      <button class="btn" data-num="8">8</button>
      <button class="btn" data-num="9">9</button>
      <button class="btn btn-operator" data-op="*" aria-label="Multiply">×</button>

      <button class="btn" data-num="4">4</button>
      <button class="btn" data-num="5">5</button>
      <button class="btn" data-num="6">6</button>
      <button class="btn btn-operator" data-op="-" aria-label="Subtract">−</button>

      <button class="btn" data-num="1">1</button>
      <button class="btn" data-num="2">2</button>
      <button class="btn" data-num="3">3</button>
      <button class="btn btn-operator" data-op="+" aria-label="Add">+</button>

      <button class="btn btn-zero" data-num="0">0</button>
      <button class="btn" data-num=".">.</button>
      <button class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
